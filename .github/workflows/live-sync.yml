# Game-time ingest cadence (Phase 7 / R-005).
#
# Vercel Hobby only allows DAILY cron schedules, so the in-play data feed —
# the thing the P-012 buy halt judges freshness on — is refreshed from here:
# every 5 minutes (GitHub's minimum; actual firing drifts by a few minutes
# under load, which is why IN_PLAY_FEED_MAX_AGE_MS is sized for two missed
# ticks, not one). Hits the secret-guarded, read-only live-sync endpoint;
# the heavy daily sports-sync (reclaim, reband, creation, settlement) stays
# on the Vercel cron.
#
# Requires the repo Actions secret CRON_SECRET to equal the production
# CRON_SECRET in Vercel. Until it is set, runs fail with 401 (harmless).
name: live-sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Live slate + pool price tick
        run: |
          curl -sS -f -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://test-mantua.vercel.app/api/cron/live-sync
