# Every `main` merge must end up as a Vercel production deployment.
#
# What actually happened on 2026-09-30 / 10-01 (three merges looked
# "skipped"): on the Hobby plan Vercel builds ONE deployment at a time and a
# build takes ~6–7 minutes, so a `main` build queues behind the PR preview
# that preceded it. Deploying the same commit by hand from the CLI while it
# waited made the Ignored Build Step ("skip commits with a previously
# deployed SHA") drop the queued build — the integration was never broken,
# it was pre-empted. GitHub's Production deployment record for a commit is
# written when its build COMPLETES, so an early check reads "missing".
#
# Hence this guard is patient: it polls for up to 25 minutes before it does
# anything. Only then, if the VERCEL_DEPLOY_HOOK secret is set (Project
# Settings → Git → Deploy Hooks → branch `main`), it fires the hook and
# polls again; without the hook it fails the run so the gap is visible.
# Never deploy a `main` commit by hand while a build is queued.
#
# The hook URL is a secret (anyone holding it can trigger builds):
# `gh secret set VERCEL_DEPLOY_HOOK` — paste at the prompt, never in chat.
name: vercel-production-guard

on:
  push:
    branches: [main]

permissions:
  deployments: read

concurrency:
  group: vercel-production-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for Vercel to build this commit (up to 25 minutes)
        id: wait
        run: |
          for i in $(seq 1 25); do
            count=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&per_page=10" \
              -q '[.[] | select(.environment == "Production")] | length')
            if [ "$count" != "0" ]; then
              echo "production deployment present after ${i} min"
              echo "present=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 60
          done
          echo "no production deployment after 25 min"
          echo "present=0" >> "$GITHUB_OUTPUT"
      - name: Fire the Deploy Hook and wait again (self-heal)
        if: steps.wait.outputs.present == '0'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::No Vercel production deployment for ${{ github.sha }} after 25 minutes and no VERCEL_DEPLOY_HOOK secret to self-heal with. Check the Vercel Deployments page before deploying by hand."
            exit 1
          fi
          echo "::warning::No Vercel production deployment for ${{ github.sha }} after 25 minutes — triggering the deploy hook"
          curl -sS -f -X POST "$HOOK" | head -c 400; echo
          for i in $(seq 1 20); do
            sleep 60
            count=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&per_page=10" \
              -q '[.[] | select(.environment == "Production")] | length')
            if [ "$count" != "0" ]; then echo "production deployment present after hook (${i} min)"; exit 0; fi
          done
          echo "::error::Deploy hook fired but Vercel still shows no production deployment for ${{ github.sha }} — check the Vercel dashboard."
          exit 1
