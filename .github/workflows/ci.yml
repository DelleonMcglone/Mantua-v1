name: CI

# B-012 / 012-ci-baseline — lint + typecheck + tests must be GREEN on every
# PR and on pushes to main. The repo carries no known-baseline escapes any
# more: typecheck is 0 errors, lint runs with --max-warnings 0, and both
# workspaces' test suites pass, so every step here is strict.
# Foundry contract tests live in contracts.yml (different toolchain).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Root install covers both workspaces (client, server).
      # .npmrc's legacy-peer-deps applies to npm ci as well.
      - name: Install
        run: npm ci

      # Runs tsc -b --noEmit in every workspace.
      - name: Typecheck
        run: npm run typecheck

      # Repo-wide eslint with --max-warnings 0. The root script pins a 4 GB
      # V8 heap: the type-aware rules hold both workspaces' programs at
      # once (~1.9 GB live after task 072), which exceeds Node's default
      # heap on the hosted runner.
      - name: Lint
        run: npm run lint

      - name: Client tests
        run: npm test --workspace=@mantua/client

      # server/src/env.ts parses required vars at module load, so test
      # files that transitively import it need stubs. These satisfy the
      # zod schema only — no external service is contacted.
      - name: Server tests
        env:
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          PRIVY_APP_ID: ci-stub
          PRIVY_APP_SECRET: ci-stub
        run: npm test --workspace=@mantua/server

