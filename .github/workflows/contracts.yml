name: Contracts (Arc Mainnet fork)

# P9-002 — Foundry test suite for the contracts/ workspace.
#
# Runs on every PR / push to main against the live Arc Mainnet chain
# via fork. The fork URL is taken from the `ARC_RPC_URL`
# secret if present; otherwise falls back to the public endpoint
# (rate-limited but works for the small fanout these tests need).
#
# Lives separately from `ci.yml` because Foundry needs its own
# install + cache strategy and the runtime is meaningfully different
# (network-bound forks vs. pure-JS unit tests).

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-test:
    name: forge test (Arc Mainnet fork)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    env:
      # Public Arc Mainnet endpoint for fork tests. Override via repo
      # secret ARC_RPC_URL when rate-limit becomes an issue.
      ARC_RPC_URL: ${{ secrets.ARC_RPC_URL || 'https://rpc.mainnet.arc.io' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry versions
        run: forge --version

      # `contracts/lib/` is gitignored — local devs run these install
      # commands once (see `contracts/README.md`). The CI workflow was
      # missing the step, so every previous run failed with "Source not
      # found" on `v4-core/`, `forge-std/`, `solmate/`, etc.
      #
      # Wrapped in a 3-attempt retry (same pattern as the gating tests
      # below): dependency clones off github.com flake with git exit
      # 128 under fanout. A failed attempt can leave half-cloned dirs
      # behind that a blind re-run of `forge install` would trip over,
      # so retries clear them first.
      #
      # permit2 is installed explicitly: `permit2/=lib/permit2/` in
      # remappings.txt is imported parent-root-relative by v4-periphery
      # sources and the deploy scripts, but a --no-git clone of
      # v4-periphery only nests its own lib/permit2 copy, which does
      # not satisfy the parent-level remapping.
      - name: Install Foundry deps (parent)
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::forge install attempt $attempt"
            if [ "$attempt" -gt 1 ]; then
              rm -rf lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable lib/base-contracts lib/permit2 lib/v4-core lib/v4-periphery lib/solmate
            fi
            if forge install foundry-rs/forge-std --no-git && \
               forge install OpenZeppelin/openzeppelin-contracts --no-git && \
               forge install Uniswap/permit2 --no-git && \
               forge install Uniswap/v4-core --no-git && \
               forge install Uniswap/v4-periphery --no-git && \
               forge install transmissions11/solmate --no-git && \
               forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.7.0 --no-git && \
               forge install erc-8183/base-contracts@142e669 --no-git; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; sleeping 15s before retry…"
            sleep 15
          done
          exit 1

      # Fail fast before `forge build` if any dependency clone failed:
      # a missing (or empty, i.e. partial) lib/ source otherwise
      # surfaces as a confusing "Source not found" error deep in the
      # build step instead of a clear install failure.
      - name: Verify installed sources
        run: |
          set -e
          for dep in forge-std openzeppelin-contracts permit2 v4-core v4-periphery solmate; do
            if [ ! -d "lib/$dep" ] || [ -z "$(ls -A "lib/$dep")" ]; then
              echo "::error::Missing or empty contracts/lib/$dep after forge install"
              exit 1
            fi
          done

      - name: Build contracts
        run: forge build --sizes

      # The market lifecycle fork E2E is the gating test. It runs against
      # current Arc Mainnet state and exercises the whole market flow
      # (bootstrap → trade → resolve → redeem) on the Dynamic Market stack.
      #
      # Wrapped in a 3-attempt retry because the public
      # `https://rpc.mainnet.arc.io` endpoint occasionally returns
      # Cloudflare 502s under fanout. Set the ARC_RPC_URL
      # secret to a dedicated provider (Alchemy / Infura / QuickNode
      # free tier) to drop the retry overhead.
      - name: Run gating fork tests (must pass)
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::forge test attempt $attempt"
            if forge test --match-contract "MarketLifecycleForkE2E" -vv; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; sleeping 15s before retry…"
            sleep 15
          done
          exit 1

