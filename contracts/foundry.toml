[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Auto-detect handles per-file pragma: the vendored ERC-8183 contracts pin
# `pragma solidity 0.8.26` (exact); monorepo-owned sources target 0.8.27+.
# A single fixed `solc` setting can't satisfy both.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

# Circle's arc-foundry (`arc-forge`, `arc-anvil`): `FOUNDRY_PROFILE=arc` selects
# the Arc EVM, which routes Arc's native-USDC ERC-20 transfers through the
# native balance — vanilla Foundry cannot (TRANSFER_FROM_FAILED). Used by the
# real-USDC fork run: FORK_REAL_USDC=1 FOUNDRY_PROFILE=arc arc-forge test …
[profile.arc]
network = "arc"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
# Arc Mainnet (5042) — USDC is the gas token. Use a dedicated provider URL
# (ARC_RPC_URL) for anything beyond a read; the public host is rate-limited.
arc = "https://rpc.mainnet.arc.io"
arc_fork = "http://127.0.0.1:8545"
# Arc Testnet (5042002) — development only, never a production code path.
arc_testnet = "https://rpc.testnet.arc.io"

# Arcscan is Blockscout: `forge verify-contract --verifier blockscout
# --verifier-url https://explorer.arc.io/api` needs no API key. The entry
# keeps `--chain arc` resolvable; see deploy/dynamic-market/verify.sh.
[etherscan]
arc = { key = "", chain = 5042, url = "https://explorer.arc.io/api" }
arc_testnet = { key = "", chain = 5042002, url = "https://explorer.testnet.arc.io/api" }
